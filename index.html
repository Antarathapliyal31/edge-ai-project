<!DOCTYPE html>
<html>

<head>
    <title>Edge AI Benchmark</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1100px;
        }

        h1,
        h2 {
            margin-bottom: 8px;
        }

        h3 {
            margin: 6px 0;
        }

        /* ── Model Cards ── */
        #modelGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }

        .model-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .model-card:hover {
            border-color: #2563eb;
            background: #f0f4ff;
        }

        .model-card.selected {
            border-color: #2563eb;
            background: #e8f0fe;
        }

        .model-card.large-model {
            border-style: dashed;
        }

        .model-card .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            padding: 2px 6px;
            margin-bottom: 6px;
        }

        .badge-small {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-large {
            background: #fee2e2;
            color: #991b1b;
        }

        .model-card h3 {
            font-size: 14px;
            margin: 4px 0;
        }

        .model-card .meta {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }

        .model-card .desc {
            font-size: 12px;
            color: #333;
            margin-top: 6px;
            font-style: italic;
        }

        .model-card input[type="radio"] {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        /* ── Buttons ── */
        .btn {
            padding: 8px 16px;
            margin-right: 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #loadBtn {
            background: #2563eb;
            color: white;
            border: 1px solid #1d4ed8;
        }

        #sendBtn {
            background: #059669;
            color: white;
            border: 1px solid #047857;
        }

        #benchmarkBtn {
            background: #7c3aed;
            color: white;
            border: 1px solid #6d28d9;
        }

        #runAllBtn {
            background: #dc2626;
            color: white;
            border: 1px solid #b91c1c;
        }

        #exportBtn {
            background: #0891b2;
            color: white;
            border: 1px solid #0e7490;
            display: none;
            margin-top: 10px;
        }

        /* ── Info boxes ── */
        .info-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            margin-top: 8px;
        }

        #statusBox {
            background: #fffbeb;
            border-color: #f59e0b;
        }

        #responseBox {
            white-space: pre-wrap;
            min-height: 40px;
        }

        #metricsBox {
            background: #f0f0f0;
        }

        #systemBox {
            background: #e8f0fe;
        }

        #summaryBox {
            background: #f0fdf4;
            display: none;
        }

        #compareBox {
            background: #fdf4ff;
            display: none;
        }

        /* ── Progress ── */
        #progressWrap {
            display: none;
            margin: 6px 0;
        }

        #progressBar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        #progressFill {
            height: 100%;
            background: #2563eb;
            width: 0%;
            transition: width 0.3s ease;
        }

        #progressLabel {
            font-size: 12px;
            color: #555;
            margin-top: 2px;
        }

        /* ── Tables ── */
        #resultsWrap {
            margin-top: 12px;
            overflow-x: auto;
            display: none;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 5px 8px;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        .compare-table th {
            background: #7c3aed;
        }

        /* ── Model loaded indicator ── */
        #loadedBadge {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
            vertical-align: middle;
            display: none;
        }

        section {
            margin-top: 20px;
        }

        textarea {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <h1>Edge AI Benchmark <span id="loadedBadge"></span></h1>

    <!-- ── Model Selection ── -->
    <section>
        <h2>1. Select a Model</h2>
        <div id="modelGrid"></div>
        <button id="loadBtn" class="btn">Load Selected Model</button>
    </section>

    <!-- ── Status ── -->
    <div id="statusBox" class="info-box" style="margin-top:12px;">Select a model above and click Load.</div>
    <div id="modelInfoLine" style="font-family:monospace; color:#555; font-size:12px; margin-top:4px;"></div>

    <!-- ── Chat ── -->
    <section>
        <h2>2. Chat</h2>
        <textarea id="prompt" rows="3" cols="60" placeholder="Type your message here..."></textarea>
        <br><br>
        <button id="sendBtn" class="btn" disabled>Send</button>
    </section>
    <div id="responseBox" class="info-box" style="margin-top:8px; display:none;"></div>
    <div id="metricsBox" class="info-box" style="display:none;"></div>

    <!-- ── Benchmark ── -->
    <section>
        <h2>3. Benchmark</h2>
        <button id="benchmarkBtn" class="btn" disabled>Run Benchmark on Loaded Model (20 queries)</button>
        <button id="runAllBtn" class="btn" disabled>Run All Small Models (3 × 20 queries)</button>
    </section>

    <div id="progressWrap">
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
        <div id="progressLabel"></div>
    </div>

    <div id="summaryBox" class="info-box"></div>
    <div id="compareBox" class="info-box"></div>
    <div id="resultsWrap"></div>

    <button id="exportBtn" class="btn">Export Results as CSV</button>

    <!-- ── System Info ── -->
    <section>
        <div id="systemBox" class="info-box" style="display:none;"></div>
    </section>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        // ── Model registry ──────────────────────────────────────────
        const MODELS = [
            {
                id: "Llama-3.2-1B-Instruct-q4f16_1-MLC",
                label: "Llama 3.2 · 1B",
                org: "Meta",
                params: "1B",
                size_mb: 700,
                quant: "q4f16",
                description: "Same Llama family as 8B — direct scale comparison",
                tag: "small",
            },
            {
                id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC",
                label: "Qwen 2.5 · 1.5B",
                org: "Alibaba",
                params: "1.5B",
                size_mb: 900,
                quant: "q4f16",
                description: "Strong on coding & math; multilingual",
                tag: "small",
            },
            {
                id: "SmolLM2-1.7B-Instruct-q4f16_1-MLC",
                label: "SmolLM2 · 1.7B",
                org: "HuggingFace",
                params: "1.7B",
                size_mb: 1000,
                quant: "q4f16",
                description: "Purpose-built for edge/constrained devices",
                tag: "small",
            },
            {
                id: "Llama-3.1-8B-Instruct-q4f32_1-MLC",
                label: "Llama 3.1 · 8B",
                org: "Meta",
                params: "8B",
                size_mb: 4500,
                quant: "q4f32",
                description: "Original large model (~20 hrs on laptop)",
                tag: "large",
            },
        ];

        // ── Test prompts ─────────────────────────────────────────────
        const TEST_PROMPTS = [
            { id: "Q01", category: "Factual-Simple", prompt: "What is the capital of France?", expected: "Paris" },
            { id: "Q02", category: "Factual-Simple", prompt: "What planet is closest to the Sun?", expected: "Mercury" },
            { id: "Q03", category: "Factual-Simple", prompt: "Who wrote the play Romeo and Juliet?", expected: "Shakespeare" },
            { id: "Q04", category: "Factual-Moderate", prompt: "What is photosynthesis?", expected: "Plants convert sunlight to glucose/oxygen" },
            { id: "Q05", category: "Factual-Moderate", prompt: "Explain what HTTP status code 404 means.", expected: "Not Found" },
            { id: "Q06", category: "Technical-CS", prompt: "What is the difference between a stack and a queue in data structures?", expected: "Stack=LIFO, Queue=FIFO" },
            { id: "Q07", category: "Technical-CS", prompt: "What is the time complexity of binary search?", expected: "O(log n)" },
            { id: "Q08", category: "Technical-ML", prompt: "What is PCA in machine learning?", expected: "Principal Component Analysis, dimensionality reduction" },
            { id: "Q09", category: "Technical-ML", prompt: "What is overfitting in machine learning?", expected: "Model learns training data too well, poor on new data" },
            { id: "Q10", category: "Reasoning-Math", prompt: "If a train travels at 60 miles per hour, how far will it travel in 2.5 hours?", expected: "150 miles" },
            { id: "Q11", category: "Reasoning-Math", prompt: "What is 15% of 200?", expected: "30" },
            { id: "Q12", category: "Reasoning-Logic", prompt: "If all roses are flowers, and some flowers fade quickly, can we conclude that some roses fade quickly?", expected: "No" },
            { id: "Q13", category: "Reasoning-Logic", prompt: "A farmer has 17 sheep. All but 9 die. How many sheep are left?", expected: "9" },
            { id: "Q14", category: "Code", prompt: "Write a Python function that takes a list of numbers and returns the largest number.", expected: "Working Python code" },
            { id: "Q15", category: "Code", prompt: "Write a Python function to check if a string is a palindrome.", expected: "Working Python code" },
            { id: "Q16", category: "Summarization", prompt: "Summarize the concept of supply and demand in economics in 2-3 sentences.", expected: "Price relationship with supply/demand" },
            { id: "Q17", category: "Instruction", prompt: "List exactly 3 programming languages that start with the letter P.", expected: "Exactly 3 languages starting with P" },
            { id: "Q18", category: "Instruction", prompt: "Explain what an API is in exactly one sentence.", expected: "One sentence about software communication" },
            { id: "Q19", category: "Long-Response", prompt: "Explain how the internet works, covering at least DNS, TCP/IP, and HTTP.", expected: "Covers DNS, TCP/IP, HTTP" },
            { id: "Q20", category: "Long-Response", prompt: "Compare and contrast supervised learning and unsupervised learning in machine learning.", expected: "Labeled vs unlabeled data" },
        ];

        // ── State ────────────────────────────────────────────────────
        const engine = new webllm.MLCEngine();
        let currentModel = null;   // model object from MODELS
        let selectedModelId = MODELS[0].id;
        let modelLoadTimeSec = 0;
        let loadedFromCache = false;
        let allBenchmarkResults = [];   // last single-model run
        let multiModelResults = {};   // { modelId: [...results] }

        // ── DOM refs ─────────────────────────────────────────────────
        const statusEl = document.getElementById("statusBox");
        const modelInfoEl = document.getElementById("modelInfoLine");
        const loadedBadge = document.getElementById("loadedBadge");
        const promptEl = document.getElementById("prompt");
        const sendBtn = document.getElementById("sendBtn");
        const loadBtn = document.getElementById("loadBtn");
        const benchmarkBtn = document.getElementById("benchmarkBtn");
        const runAllBtn = document.getElementById("runAllBtn");
        const progressWrap = document.getElementById("progressWrap");
        const progressFill = document.getElementById("progressFill");
        const progressLabel = document.getElementById("progressLabel");
        const responseBox = document.getElementById("responseBox");
        const metricsBox = document.getElementById("metricsBox");
        const systemBox = document.getElementById("systemBox");
        const summaryBox = document.getElementById("summaryBox");
        const compareBox = document.getElementById("compareBox");
        const resultsWrap = document.getElementById("resultsWrap");
        const exportBtn = document.getElementById("exportBtn");

        // ── Build model cards ─────────────────────────────────────────
        const grid = document.getElementById("modelGrid");
        MODELS.forEach((m, i) => {
            const card = document.createElement("div");
            card.className = "model-card" + (m.tag === "large" ? " large-model" : "");
            if (i === 0) card.classList.add("selected");
            card.dataset.id = m.id;
            card.innerHTML = `
                <input type="radio" name="modelPick" value="${m.id}" ${i === 0 ? "checked" : ""}>
                <span class="badge ${m.tag === "small" ? "badge-small" : "badge-large"}">
                    ${m.tag === "small" ? "SMALL ~" + m.size_mb + " MB" : "LARGE ~" + (m.size_mb / 1000).toFixed(1) + " GB"}
                </span>
                <h3>${m.label}</h3>
                <div class="meta">
                    By ${m.org} &nbsp;|&nbsp; ${m.params} params &nbsp;|&nbsp; ${m.quant}
                </div>
                <div class="desc">${m.description}</div>
            `;
            card.addEventListener("click", () => {
                document.querySelectorAll(".model-card").forEach(c => c.classList.remove("selected"));
                card.classList.add("selected");
                card.querySelector("input").checked = true;
                selectedModelId = m.id;
            });
            grid.appendChild(card);
        });

        // ── Load model ────────────────────────────────────────────────
        loadBtn.addEventListener("click", () => loadModel(selectedModelId));

        async function loadModel(modelId) {
            const meta = MODELS.find(m => m.id === modelId);
            loadBtn.disabled = true;
            sendBtn.disabled = true;
            benchmarkBtn.disabled = true;
            runAllBtn.disabled = true;
            loadedBadge.style.display = "none";

            const loadStart = performance.now();
            let storeBefore = 0;
            try { storeBefore = (await navigator.storage.estimate()).usage; } catch (_) { }

            statusEl.textContent = `Downloading ${meta.label} (~${meta.size_mb >= 1000 ? (meta.size_mb / 1000).toFixed(1) + "GB" : meta.size_mb + "MB"})… first load takes a few minutes.`;

            await engine.reload(modelId, {
                initProgressCallback: (p) => { statusEl.textContent = p.text; }
            });

            const loadEnd = performance.now();
            modelLoadTimeSec = ((loadEnd - loadStart) / 1000).toFixed(1);

            let storeAfter = 0;
            try { storeAfter = (await navigator.storage.estimate()).usage; } catch (_) { }
            loadedFromCache = (storeAfter - storeBefore) < 100 * 1024 * 1024;

            currentModel = meta;
            statusEl.textContent = `${meta.label} ready! (${modelLoadTimeSec}s — ${loadedFromCache ? "from cache" : "fresh download"})`;
            modelInfoEl.textContent = `Loaded: ${meta.id} | ~${meta.size_mb}MB | ${meta.params} params | ${meta.quant}`;
            loadedBadge.textContent = meta.label;
            loadedBadge.style.display = "inline-block";

            sendBtn.disabled = false;
            benchmarkBtn.disabled = false;
            runAllBtn.disabled = false;
            loadBtn.disabled = false;

            systemBox.style.display = "block";
            systemBox.innerHTML = await getSystemMetrics();
        }

        // ── Chat ──────────────────────────────────────────────────────
        sendBtn.addEventListener("click", async () => {
            const userMsg = promptEl.value.trim();
            if (!userMsg || !currentModel) return;

            setControlsDisabled(true);
            responseBox.style.display = "block";
            metricsBox.style.display = "block";
            responseBox.textContent = "";
            metricsBox.textContent = "Generating…";

            const t0 = performance.now();
            let firstTok = null, tokenCount = 0;

            const reply = await engine.chat.completions.create({
                messages: [{ role: "user", content: userMsg }],
                temperature: 0.0, max_tokens: 256, stream: true,
            });

            for await (const chunk of reply) {
                const tok = chunk.choices[0]?.delta?.content || "";
                if (tok && !firstTok) firstTok = performance.now();
                if (tok) { tokenCount++; responseBox.textContent += tok; }
            }

            const t1 = performance.now();
            const ttft = firstTok - t0;
            const totalTime = t1 - t0;
            const decodeTime = t1 - firstTok;
            const tps = tokenCount / (decodeTime / 1000);
            const estPT = Math.ceil(userMsg.length / 4);

            metricsBox.innerHTML =
                "<b>Performance Metrics:</b><br>" +
                "Model: " + currentModel.label + "<br>" +
                "TTFT: " + ttft.toFixed(0) + " ms<br>" +
                "Tokens/sec: " + tps.toFixed(1) + "<br>" +
                "Tokens generated: " + tokenCount + "<br>" +
                "Total time: " + (totalTime / 1000).toFixed(2) + " s<br>" +
                "Decode time: " + (decodeTime / 1000).toFixed(2) + " s<br>" +
                "Est. prompt tokens: " + estPT + "<br>" +
                "Prefill speed: " + (estPT / (ttft / 1000)).toFixed(1) + " t/s<br>" +
                "Response length: " + responseBox.textContent.length + " chars";

            systemBox.style.display = "block";
            systemBox.innerHTML = await getSystemMetrics();
            setControlsDisabled(false);
        });

        // ── Single benchmark ──────────────────────────────────────────
        benchmarkBtn.addEventListener("click", async () => {
            if (!currentModel) return;
            setControlsDisabled(true);
            allBenchmarkResults = [];
            compareBox.style.display = "none";

            const totTime = await runBenchmarkForModel(currentModel, allBenchmarkResults);
            displaySingleSummary(allBenchmarkResults, currentModel, totTime);
            displayPerQueryTable(allBenchmarkResults, "resultsWrap");

            exportBtn.style.display = "inline-block";
            systemBox.style.display = "block";
            systemBox.innerHTML = await getSystemMetrics();
            setControlsDisabled(false);
        });

        // ── Run all small models ──────────────────────────────────────
        runAllBtn.addEventListener("click", async () => {
            setControlsDisabled(true);
            multiModelResults = {};
            summaryBox.style.display = "none";
            compareBox.style.display = "none";
            resultsWrap.style.display = "none";
            allBenchmarkResults = [];

            const smallModels = MODELS.filter(m => m.tag === "small");

            for (let mi = 0; mi < smallModels.length; mi++) {
                const meta = smallModels[mi];
                statusEl.textContent = `[${mi + 1}/${smallModels.length}] Loading ${meta.label}…`;

                // reload engine with this model
                loadedBadge.textContent = meta.label;
                loadedBadge.style.display = "inline-block";

                const loadStart = performance.now();
                let storeBefore = 0;
                try { storeBefore = (await navigator.storage.estimate()).usage; } catch (_) { }

                await engine.reload(meta.id, {
                    initProgressCallback: (p) => { statusEl.textContent = `[${mi + 1}/${smallModels.length}] ${p.text}`; }
                });

                const loadEnd = performance.now();
                modelLoadTimeSec = ((loadEnd - loadStart) / 1000).toFixed(1);
                let storeAfter = 0;
                try { storeAfter = (await navigator.storage.estimate()).usage; } catch (_) { }
                loadedFromCache = (storeAfter - storeBefore) < 100 * 1024 * 1024;
                currentModel = meta;

                const results = [];
                await runBenchmarkForModel(meta, results);
                multiModelResults[meta.id] = results;
                allBenchmarkResults = results;

                // Auto-save individual CSV as soon as each model finishes
                const shortName = meta.label.replace(/[^a-zA-Z0-9]/g, "_");
                triggerCSVDownload(results, `benchmark_${shortName}_${new Date().toISOString().slice(0,10)}.csv`);
                statusEl.textContent = `[${mi+1}/${smallModels.length}] ${meta.label} done — CSV saved. Loading next…`;
            }

            displayComparisonTable(multiModelResults);
            exportBtn.textContent = "Export All CSVs (Individual + Combined)";
            exportBtn.style.display = "inline-block";
            systemBox.style.display = "block";
            systemBox.innerHTML = await getSystemMetrics();
            setControlsDisabled(false);
            statusEl.textContent = "All small model benchmarks complete! Individual CSVs auto-saved — click Export for combined.";
        });

        // ── Core benchmark runner ─────────────────────────────────────
        async function runBenchmarkForModel(meta, resultsArr) {
            progressWrap.style.display = "block";
            progressFill.style.width = "0%";
            metricsBox.style.display = "block";
            const benchStart = performance.now();

            for (let i = 0; i < TEST_PROMPTS.length; i++) {
                const test = TEST_PROMPTS[i];
                const pct = ((i + 1) / TEST_PROMPTS.length * 100).toFixed(0);
                progressFill.style.width = pct + "%";
                progressLabel.textContent = `${meta.label} — query ${i + 1}/${TEST_PROMPTS.length}: ${test.id} (${test.category})`;
                metricsBox.textContent = progressLabel.textContent;

                try {
                    const r = await runQuery(test.prompt);
                    resultsArr.push({ ...test, ...r, model: meta.id, modelLabel: meta.label, error: null });
                } catch (e) {
                    resultsArr.push({
                        ...test,
                        response: "", ttft: 0, totalTime: 0, decodeTime: 0,
                        tokenCount: 0, tokensPerSec: 0, estimatedPromptTokens: 0,
                        prefillSpeed: 0, responseLength: 0,
                        model: meta.id, modelLabel: meta.label, error: e.message,
                    });
                }
            }

            const totalSec = ((performance.now() - benchStart) / 1000).toFixed(1);
            progressWrap.style.display = "none";
            return totalSec;
        }

        async function runQuery(prompt) {
            const t0 = performance.now();
            let firstTok = null, tokenCount = 0, fullResponse = "";

            const reply = await engine.chat.completions.create({
                messages: [{ role: "user", content: prompt }],
                temperature: 0.0, max_tokens: 256, stream: true,
            });
            for await (const chunk of reply) {
                const tok = chunk.choices[0]?.delta?.content || "";
                if (tok && !firstTok) firstTok = performance.now();
                if (tok) { tokenCount++; fullResponse += tok; }
            }

            const t1 = performance.now();
            const ttft = firstTok ? firstTok - t0 : 0;
            const totalTime = t1 - t0;
            const decodeTime = firstTok ? t1 - firstTok : 0;
            const tokensPerSec = decodeTime > 0 ? tokenCount / (decodeTime / 1000) : 0;
            const estimatedPromptTokens = Math.ceil(prompt.length / 4);
            const prefillSpeed = ttft > 0 ? estimatedPromptTokens / (ttft / 1000) : 0;

            return {
                response: fullResponse, ttft, totalTime, decodeTime,
                tokenCount, tokensPerSec, estimatedPromptTokens, prefillSpeed,
                responseLength: fullResponse.length
            };
        }

        // ── Display helpers ───────────────────────────────────────────
        function computeStats(results) {
            const valid = results.filter(r => r.tokenCount > 0);
            if (!valid.length) return null;
            const ttfts = valid.map(r => r.ttft);
            const tpsList = valid.map(r => r.tokensPerSec);
            const total_tokens = valid.reduce((s, r) => s + r.tokenCount, 0);
            const total_time = valid.reduce((s, r) => s + r.totalTime / 1000, 0);
            const first5tps = tpsList.slice(0, 5).reduce((a, b) => a + b, 0) / Math.min(5, tpsList.length);
            const last5tps = tpsList.slice(-5).reduce((a, b) => a + b, 0) / Math.min(5, tpsList.length);
            return {
                avgTTFT: ttfts.reduce((a, b) => a + b, 0) / ttfts.length,
                minTTFT: Math.min(...ttfts), maxTTFT: Math.max(...ttfts),
                avgTPS: tpsList.reduce((a, b) => a + b, 0) / tpsList.length,
                minTPS: Math.min(...tpsList), maxTPS: Math.max(...tpsList),
                total_tokens, total_time,
                qpm: (valid.length / (total_time / 60)).toFixed(1),
                throttleDrop: ((first5tps - last5tps) / first5tps * 100).toFixed(1),
                first5tps, last5tps,
            };
        }

        function displaySingleSummary(results, meta, totalTimeSec) {
            const s = computeStats(results);
            if (!s) return;
            summaryBox.style.display = "block";
            summaryBox.innerHTML =
                `<b>BENCHMARK SUMMARY — ${meta.label} (${meta.org})</b><br>` +
                `Date: ${new Date().toISOString()}<br><br>` +
                `<b>LATENCY</b><br>` +
                `  Avg TTFT: ${s.avgTTFT.toFixed(0)} ms &nbsp;|&nbsp; Min: ${s.minTTFT.toFixed(0)} ms &nbsp;|&nbsp; Max: ${s.maxTTFT.toFixed(0)} ms<br><br>` +
                `<b>THROUGHPUT</b><br>` +
                `  Avg TPS: ${s.avgTPS.toFixed(1)} &nbsp;|&nbsp; Min: ${s.minTPS.toFixed(1)} &nbsp;|&nbsp; Max: ${s.maxTPS.toFixed(1)}<br>` +
                `  Total tokens: ${s.total_tokens} &nbsp;|&nbsp; QPM: ${s.qpm}<br><br>` +
                `<b>THERMAL THROTTLING</b><br>` +
                `  First 5 avg TPS: ${s.first5tps.toFixed(1)} &nbsp;|&nbsp; Last 5 avg TPS: ${s.last5tps.toFixed(1)} &nbsp;|&nbsp; Drop: ${s.throttleDrop}%<br><br>` +
                `<b>RESOURCE</b><br>` +
                `  Model size: ~${meta.size_mb}MB &nbsp;|&nbsp; Load time: ${modelLoadTimeSec}s &nbsp;|&nbsp; Cache: ${loadedFromCache ? "Yes" : "No"}<br>` +
                `  Total benchmark time: ${totalTimeSec}s<br><br>` +
                `<b>COST (${results.length} queries)</b><br>` +
                `  Browser (WebGPU): $0.00<br>` +
                `  vs GPT-4o-mini: ~$${(s.total_tokens * 0.00000060).toFixed(4)}<br>` +
                `  vs Claude Haiku: ~$${(s.total_tokens * 0.00000125).toFixed(4)}`;
        }

        function displayPerQueryTable(results, containerId) {
            const wrap = document.getElementById(containerId);
            let html = `<br><b>Per-Query Results — ${results[0]?.modelLabel || ""}:</b><br><table>`;
            html += "<tr><th>ID</th><th>Category</th><th>TTFT (ms)</th><th>TPS</th><th>Tokens</th><th>Total (s)</th><th>Prefill (t/s)</th><th>Chars</th><th>Response Preview</th><th>Expected</th></tr>";
            results.forEach(r => {
                const preview = r.response.substring(0, 70).replace(/\n/g, " ") + (r.response.length > 70 ? "…" : "");
                html += `<tr>
                    <td>${r.id}</td><td>${r.category}</td>
                    <td>${r.ttft.toFixed(0)}</td><td>${r.tokensPerSec.toFixed(1)}</td>
                    <td>${r.tokenCount}</td><td>${(r.totalTime / 1000).toFixed(2)}</td>
                    <td>${r.prefillSpeed.toFixed(1)}</td><td>${r.responseLength}</td>
                    <td>${preview}</td><td>${r.expected}</td>
                </tr>`;
            });
            html += "</table>";
            wrap.style.display = "block";
            wrap.innerHTML = html;
        }

        function displayComparisonTable(multiResults) {
            const modelIds = Object.keys(multiResults);
            if (!modelIds.length) return;

            // Summary comparison
            let compHtml = `<b>SMALL MODEL COMPARISON SUMMARY</b><br>Date: ${new Date().toISOString()}<br><br>`;
            compHtml += `<table class="compare-table"><tr>
                <th>Model</th><th>Params</th><th>Size</th><th>Avg TTFT (ms)</th>
                <th>Avg TPS</th><th>Max TPS</th><th>Total Tokens</th><th>QPM</th><th>Throttle Drop %</th>
            </tr>`;

            modelIds.forEach(mid => {
                const meta = MODELS.find(m => m.id === mid);
                const s = computeStats(multiResults[mid]);
                if (!s) return;
                compHtml += `<tr>
                    <td><b>${meta.label}</b><br><small>${meta.org}</small></td>
                    <td>${meta.params}</td><td>~${meta.size_mb}MB</td>
                    <td>${s.avgTTFT.toFixed(0)}</td>
                    <td>${s.avgTPS.toFixed(1)}</td><td>${s.maxTPS.toFixed(1)}</td>
                    <td>${s.total_tokens}</td><td>${s.qpm}</td>
                    <td>${s.throttleDrop}%</td>
                </tr>`;
            });
            compHtml += "</table>";
            compareBox.style.display = "block";
            compareBox.innerHTML = compHtml;

            // Per-query breakdown per model
            let detailHtml = "";
            modelIds.forEach(mid => {
                const meta = MODELS.find(m => m.id === mid);
                const results = multiResults[mid];
                detailHtml += `<br><b>Per-Query — ${meta.label} (${meta.org}):</b><br>`;
                detailHtml += `<table><tr><th>ID</th><th>Category</th><th>TTFT (ms)</th><th>TPS</th><th>Tokens</th><th>Total (s)</th><th>Chars</th><th>Response Preview</th></tr>`;
                results.forEach(r => {
                    const preview = r.response.substring(0, 60).replace(/\n/g, " ") + (r.response.length > 60 ? "…" : "");
                    detailHtml += `<tr>
                        <td>${r.id}</td><td>${r.category}</td>
                        <td>${r.ttft.toFixed(0)}</td><td>${r.tokensPerSec.toFixed(1)}</td>
                        <td>${r.tokenCount}</td><td>${(r.totalTime / 1000).toFixed(2)}</td>
                        <td>${r.responseLength}</td><td>${preview}</td>
                    </tr>`;
                });
                detailHtml += "</table>";
            });
            resultsWrap.style.display = "block";
            resultsWrap.innerHTML = detailHtml;
        }

        // ── Export CSV ────────────────────────────────────────────────
        function buildCSV(rows) {
            const clean = (s) => '"' + String(s).replace(/"/g, '""').replace(/\n/g, " ") + '"';
            let csv = "Model,ModelLabel,ID,Category,Prompt,Expected,TTFT_ms,TPS,Tokens,TotalTime_s,DecodeTime_s,PrefillSpeed,RespChars,Response,Error\n";
            rows.forEach(r => {
                csv += [
                    clean(r.model), clean(r.modelLabel || ""), clean(r.id), clean(r.category),
                    clean(r.prompt), clean(r.expected),
                    r.ttft.toFixed(0), r.tokensPerSec.toFixed(1), r.tokenCount,
                    (r.totalTime / 1000).toFixed(2), (r.decodeTime / 1000).toFixed(2),
                    r.prefillSpeed.toFixed(1), r.responseLength,
                    clean(r.response), clean(r.error || ""),
                ].join(",") + "\n";
            });
            return csv;
        }

        function triggerCSVDownload(rows, filename) {
            const blob = new Blob([buildCSV(rows)], { type: "text/csv" });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        exportBtn.addEventListener("click", () => {
            const date = new Date().toISOString().slice(0, 10);
            const multiKeys = Object.keys(multiModelResults);

            if (multiKeys.length) {
                // Individual CSV per model
                multiKeys.forEach(mid => {
                    const meta = MODELS.find(m => m.id === mid);
                    const shortName = meta.label.replace(/[^a-zA-Z0-9]/g, "_");
                    triggerCSVDownload(multiModelResults[mid], `benchmark_${shortName}_${date}.csv`);
                });

                // Combined CSV (all models together)
                const allRows = Object.values(multiModelResults).flat();
                triggerCSVDownload(allRows, `benchmark_small_models_combined_${date}.csv`);
            } else {
                // Single model run
                const shortName = (currentModel?.label || "model").replace(/[^a-zA-Z0-9]/g, "_");
                triggerCSVDownload(allBenchmarkResults, `benchmark_${shortName}_${date}.csv`);
            }
        });

        // ── System metrics ────────────────────────────────────────────
        async function getSystemMetrics() {
            let html = "<b>System & Resource Metrics:</b><br>";
            try {
                const est = await navigator.storage.estimate();
                const usedMB = Math.round(est.usage / 1024 / 1024);
                const availMB = Math.round(est.quota / 1024 / 1024);
                html += `Browser Storage: ${usedMB} MB / ${availMB} MB (${((est.usage / est.quota) * 100).toFixed(1)}%)<br>`;
            } catch (_) { html += "Browser Storage: unavailable<br>"; }

            if (currentModel) {
                html += `Loaded Model: ${currentModel.id}<br>`;
                html += `Model Size: ~${currentModel.size_mb} MB | Params: ${currentModel.params} | Quant: ${currentModel.quant}<br>`;
                html += `Load Time: ${modelLoadTimeSec}s | From Cache: ${loadedFromCache ? "Yes" : "No"}<br>`;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (adapter) {
                    const info = await adapter.requestAdapterInfo();
                    html += `GPU: ${info.vendor || "?"} / ${info.architecture || "?"} / ${info.device || "?"}<br>`;
                }
            } catch (_) { html += "GPU Info: unavailable<br>"; }

            html += `Browser: ${navigator.userAgent.split(") ").pop()}<br>`;
            html += `Platform: ${navigator.platform} | CPU cores: ${navigator.hardwareConcurrency} | RAM: ${navigator.deviceMemory || "?"}GB`;
            return html;
        }

        // ── Utility ───────────────────────────────────────────────────
        function setControlsDisabled(disabled) {
            loadBtn.disabled = disabled;
            sendBtn.disabled = disabled || !currentModel;
            benchmarkBtn.disabled = disabled || !currentModel;
            runAllBtn.disabled = disabled;
        }
    </script>
</body>

</html>
